<div class="register-container">
  <h2>Sign Up</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="first_name">First Name</label>
      <input id="first_name" formControlName="first_name" class="form-control" placeholder="Enter your first name">
    </div>
    <div class="form-group">
      <label for="last_name">Last Name</label>
      <input id="last_name" formControlName="last_name" class="form-control" placeholder="Enter your last name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" formControlName="email" class="form-control" placeholder="Enter your email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" class="form-control" placeholder="Enter your password">
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
</div>
