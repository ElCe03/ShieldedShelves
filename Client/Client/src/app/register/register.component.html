<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="first_name">First Name</label>
    <input id="first_name" formControlName="first_name" />
    <div *ngIf="registerForm.get('first_name')?.invalid && registerForm.get('first_name')?.touched">
      First Name is required
    </div>
  </div>

  <div>
    <label for="last_name">Last Name</label>
    <input id="last_name" formControlName="last_name" />
    <div *ngIf="registerForm.get('last_name')?.invalid && registerForm.get('last_name')?.touched">
      Last Name is required
    </div>
  </div>

  <div>
    <label for="email">Email</label>
    <input id="email" formControlName="email" />
    <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
      Valid Email is required
    </div>
  </div>

  <div>
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" (input)="sanitizeInput('password')" />
    <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
      Password is required
    </div>
    <div *ngIf="passwordStrengthMessage">
      {{ passwordStrengthMessage }}
    </div>
  </div>

  <button type="submit" [disabled]="registerForm.invalid">Register</button>
</form>
