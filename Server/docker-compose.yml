services:
  redis:
    image: "redis:alpine"
    container_name: "redis"
    ports:
      - "6379:6379"

  registrazione:
    build:
      context: Utenti/Registrazione/
      dockerfile: Dockerfile.registrazione
    container_name: "registrazione"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
    ports:
      - "5000:5000"

  loginutenti:
    build:
      context: Utenti/LoginUtenti/
      dockerfile: Dockerfile.loginutenti
    container_name: "loginutenti"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
    ports:
      - "5001:5001"

  loginadmin:
    build:
      context: Utenti/LoginAdmin/
      dockerfile: Dockerfile.loginadmin
    container_name: "loginadmin"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME2=${DB_NAME2}
      - SECRET_KEY=${SECRET_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    depends_on:
      - redis
    ports:
      - "5002:5002"

  listautenti:
    build:
      context: Utenti/ListaUtenti/
      dockerfile: Dockerfile.listautenti
    container_name: "listautenti"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
    ports:
      - "5003:5003"